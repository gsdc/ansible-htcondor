---
# defaults file for roles/ansible-htcondor
condor_version: "25.0"
condor_admin: ""         # condor_admin@email.com
condor_daemon_list: ""   # "MASTER,SCHEDD,STARTD,GANGLIAD"
condor_domain: "{{ ansible_domain }}"
condor_host: ""
trust_domain: ""
condor_name: ""
condor_pool_password_file_path: "/etc/condor/passwords.d/POOL"
condor_pool_password: "hello world"
condor_cgroup_policy: "hard"
condor_cgroup_ignore_cache: true
dedicate_scheduler: ""
install_condor_repo: true
enable_dynamicslot: true
enable_singularity: false
enable_apptainer: true
enable_wholenode: false
enable_testslot: false
remove_anonymous: false
pilot_users: []
firewall_lowport: 9000
firewall_highport: 9999
firewall_whitelist: []
step: "default"
extra: ""
enable_defrag: false
defrag_option:
  interval: 3600
  draining_per_hour: 1.0
  max_whole_machine: 20
  max_concurrent_draining: 10

